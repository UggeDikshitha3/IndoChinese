services:
  - type: web
    name: indochinese-restaurant
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: master@indochinese.com
      - key: ADMIN_PASSWORD
        sync: false
