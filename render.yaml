services:
  # ----------------------------------------------------
  # 1. Frontend: React + Vite Static Website
  # ----------------------------------------------------
  - type: static
    name: indochinese-frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://indochinese.onrender.com

  # ----------------------------------------------------
  # 2. Unified Fullstack Node Service (Express + React)
  # ----------------------------------------------------
  - type: web
    name: indochinese-fullstack
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: master@indochinese.com
      - key: ADMIN_PASSWORD
        sync: false

  # ----------------------------------------------------
  # 3. Python FastAPI Backend Service (Alternative Option)
  # ----------------------------------------------------
  - type: web
    name: indochinese-backend
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: master@indochinese.com
      - key: ADMIN_PASSWORD
        sync: false
